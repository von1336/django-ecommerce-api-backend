version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_NAME: ecommerce
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  worker:
    build: .
    environment:
      DB_NAME: ecommerce
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A ecommerce worker --loglevel=info

  beat:
    build: .
    environment:
      DB_NAME: ecommerce
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A ecommerce beat --loglevel=info

volumes:
  pgdata:
